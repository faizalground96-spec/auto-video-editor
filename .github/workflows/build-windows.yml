name: Build Windows EXE

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install ffmpeg
        shell: powershell
        run: |
          $url = (Get-Content tools/ffmpeg_win.txt | Where-Object { $_ -notmatch '^\s*#' -and $_ -match '\S' } | Select-Object -First 1).Trim()
          Write-Host "ffmpeg URL: $url"
          .\tools\install_ffmpeg.ps1 -Url $url -DestExe "$PWD\bin\ffmpeg.exe"

      - name: Build with PyInstaller
        run: |
          pyinstaller build.spec --noconfirm --distpath dist --workpath build

      - name: Self-test
        shell: powershell
        run: |
          .\dist\AutoVideoEditor\AutoVideoEditorCLI.exe --self-test

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoVideoEditor-windows
          path: dist/AutoVideoEditor/
