name: Publish Release v1.0.5


on:
  workflow_dispatch:


permissions:
  contents: write
  actions: read


jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows build artifact
        uses: actions/download-artifact@v4
        with:
          name: AutoVideoEditor-windows
          path: artifact
          run-id: 37087681083
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify silero_vad_v6.onnx bundled
        run: |
          ls -la artifact/_internal/faster_whisper/assets/silero_vad_v6.onnx
          test -f artifact/_internal/faster_whisper/assets/silero_vad_v6.onnx && echo "MODEL OK" || (echo "MODEL MISSING"; exit 1)
      - name: Re-zip artifact
        run: |
          cd artifact
          zip -qr ../AutoVideoEditor-windows.zip .
          ls -la ../AutoVideoEditor-windows.zip
      - name: Create GitHub Release v1.0.5
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.5
          name: v1.0.5
          body: "Windows build of Auto Video Editor from commit a9718d9 (fix requires_at). Bundles silero_vad_v6.onnx. Contains the portable Windows .exe package."
          draft: false
          prerelease: false
          files: AutoVideoEditor-windows.zip
